<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel Connect Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #000000 0%, #2c2c2c 100%);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 3rem;
      max-width: 560px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .sub { opacity: 0.7; margin-bottom: 2rem; }
    .row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.95rem; }
    .row span:first-child { opacity: 0.6; }
    .row span:last-child { font-weight: 600; }
    .ok { color: #34d399; }
    footer { margin-top: 2rem; font-size: 0.8rem; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Vercel Deploy OK</h1>
    <p class="sub">Repo: khang26042012/phantrongkhangg</p>

    <div class="row"><span>Deployer</span><span>khang26042012</span></div>
    <div class="row"><span>Status</span><span class="ok">Connected</span></div>
    <div class="row"><span>Deploy ID</span><span id="dep">-</span></div>
    <div class="row"><span>Built at</span><span id="ts">-</span></div>

    <footer>Static page - no framework, no build step</footer>
  </div>

  <script>
    document.getElementById('dep').textContent = (self.__VERCEL_ID__ || 'static');
    document.getElementById('ts').textContent = new Date().toISOString().slice(0, 19).replace('T', ' ');
  </script>
</body>
</html>
